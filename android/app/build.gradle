apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration block
 */
react {
    /* Folders */
    // root = "../../"
    // reactNativeDir = "../../node_modules/react-native"
    // nodeExecutableAndArgs = ["node"]
    // cliPath = "node_modules/react-native/cli.js"
}

/**
 * Set this to true to create 4 separate APKs per CPU architecture.
 * This reduces APK size from ~134MB down to ~15-20MB!
 */
def enableSeparateBuildPerCPUArchitecture = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.meshconnect"

    defaultConfig {
        applicationId "com.meshconnect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            } else if (System.getenv('MYAPP_RELEASE_STORE_FILE') != null) {
                storeFile file(System.getenv('MYAPP_RELEASE_STORE_FILE'))
                storePassword System.getenv('MYAPP_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('MYAPP_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('MYAPP_RELEASE_KEY_PASSWORD')
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk true
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE') || System.getenv('MYAPP_RELEASE_STORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols = []
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
            ]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
